<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <title>Menú | Kalytero</title>
  <style>
    :root {
      --paper: #f5f1e9;
      --paper-deep: #ebe4d8;
      --ink: #1c2520;
      --muted: #68716b;
      --line: rgba(28, 37, 32, .14);
      --accent: #d66542;
      --accent-dark: #9f432d;
      --white: #fffdf8;
      --shadow: 0 18px 42px rgba(42, 45, 34, .08);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a { color: inherit; }

    .shell {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 25px 0;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-logo {
      display: block;
      width: 128px;
      height: auto;
    }

    .menu-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
    }

    .menu-trigger:hover,
    .menu-trigger[aria-expanded="true"] {
      border-color: var(--ink);
    }

    .menu-trigger svg {
      width: 18px;
      height: 18px;
    }

    .category-menu {
      position: absolute;
      z-index: 10;
      top: calc(100% - 8px);
      right: 0;
      display: grid;
      min-width: 230px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .category-menu[hidden] { display: none; }

    .category-menu a {
      padding: 10px 12px;
      border-radius: 2px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      text-decoration: none;
    }

    .category-menu a:hover,
    .category-menu a:focus-visible {
      outline: 0;
      background: var(--paper-deep);
    }

    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 70px;
      align-items: end;
      width: 100vw;
      margin-left: calc(50% - 50vw);
      padding: 112px max(20px, calc((100vw - 1160px) / 2)) 94px;
      background: url("hero-paseo-maritimo.jpg") center 58% / cover no-repeat;
      color: #fffdf8;
    }

    .hero::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(90deg, rgba(11, 25, 21, .82) 0%, rgba(11, 25, 21, .62) 52%, rgba(11, 25, 21, .42) 100%);
      content: "";
    }

    .hero-side {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero-media {
      display: none;
    }

    .hero-media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(.78) contrast(.96);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
      color: #f4a080;
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 34px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 820px;
      margin-bottom: 23px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.2rem, 7vw, 6.2rem);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: .9;
    }

    .hero-copy {
      max-width: 510px;
      margin: 0;
      color: rgba(255, 253, 248, .82);
      font-size: 1.05rem;
    }

    .hero-aside {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 14px 0 0;
      border-top: 1px solid rgba(255, 253, 248, .48);
    }

    .hero-aside strong {
      display: block;
      font-family: Georgia, serif;
      font-size: 2.6rem;
      font-weight: 400;
      line-height: 1;
    }

    .hero-aside span { color: var(--muted); font-size: .88rem; }

    .hero-aside span { color: rgba(255, 253, 248, .78); }

    .menu-toolbar {
      position: sticky;
      z-index: 5;
      top: 0;
      padding: 16px 0;
      background: rgba(245, 241, 233, .9);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .toolbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    button, input { font: inherit; }

    .filter {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: .79rem;
      white-space: nowrap;
    }

    .filter:hover, .filter.active {
      border-color: var(--ink);
      color: var(--ink);
    }

    .search {
      flex: 0 0 214px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
    }

    .search svg { flex: 0 0 auto; color: var(--muted); }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: .8rem;
    }

    .search input::placeholder { color: #9aa09b; }

    main { padding: 68px 0 100px; }

    .category {
      scroll-margin-top: 83px;
      margin-bottom: 86px;
    }

    .category-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }

    .category-heading h2 {
      margin-bottom: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 3.25rem);
      font-weight: 400;
      letter-spacing: -.05em;
      line-height: 1;
    }

    .category-count {
      color: var(--muted);
      font-size: .74rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--line);
    }

    .item {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 20px;
      min-height: 144px;
      padding: 24px 25px 21px;
      background: var(--white);
    }

    .item-image {
      width: 92px;
      height: 92px;
      align-self: start;
      border-radius: 50%;
      background: var(--paper-deep);
      object-fit: cover;
      filter: saturate(.82);
    }

    .item-details {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 24px;
    }

    .item h3 {
      max-width: 430px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.3rem;
      font-weight: 400;
      line-height: 1.12;
    }

    .price {
      flex: 0 0 auto;
      color: var(--accent-dark);
      font-size: .86rem;
      font-weight: 800;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .description {
      max-width: 540px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.5;
    }

    .empty {
      padding: 80px 0;
      color: var(--muted);
      text-align: center;
    }

    footer {
      padding: 28px 0 42px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .footer-details {
      display: grid;
      gap: 7px;
      margin: 0;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 560px); }
      .topbar { padding: 18px 0; }
      .category-menu { right: 0; width: min(230px, calc(100vw - 28px)); }
      .hero { display: block; padding: 65px 28px 53px; }
      h1 { font-size: clamp(2.9rem, 12vw, 4.8rem); }
      .hero-aside { display: flex; gap: 12px; align-items: center; margin-top: 38px; padding: 15px 0 0; border-left: 0; border-top: 1px solid var(--line); }
      .hero-aside strong { margin: 0; font-size: 2rem; }
      .toolbar-inner { display: block; }
      .filters { margin-bottom: 12px; }
      .search { width: 100%; }
      main { padding-top: 47px; }
      .category { margin-bottom: 60px; }
      .items { grid-template-columns: 1fr; }
      .item { grid-template-columns: 70px minmax(0, 1fr); gap: 14px; min-height: 112px; padding: 18px; }
      .item-image { width: 70px; height: 70px; }
      .item h3 { font-size: 1.18rem; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .category { animation: rise .55s both; animation-timeline: view(); animation-range: entry 0% cover 18%; }
      @keyframes rise { from { opacity: .2; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <header class="shell">
    <nav class="topbar" aria-label="Navegación principal">
      <a class="brand" href="#inicio" aria-label="Kalytero, inicio">
        <img class="brand-logo" src="kalytero-logo.svg" alt="Kalytero">
      </a>
      <button class="menu-trigger" id="menu-trigger" type="button" aria-controls="category-menu" aria-expanded="false" aria-label="Abrir categorías">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
      </button>
      <nav class="category-menu" id="category-menu" aria-label="Categorías del menú" hidden></nav>
    </nav>

    <section class="hero" id="inicio">
      <div>
        <h1>Tapas, Música y buen ambiente Frente al Mar</h1>
        <p class="hero-copy">Paseo Marítimo 14 y 15 Malabo Tél +240 555 911 787</p>
      </div>
    </section>
  </header>

  <div class="menu-toolbar">
    <div class="shell toolbar-inner">
      <div class="filters" id="filters" aria-label="Filtrar por categoría"></div>
      <label class="search" aria-label="Buscar en el menú">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="search" type="search" placeholder="Buscar un plato..." autocomplete="off">
      </label>
    </div>
  </div>

  <main class="shell" id="menu" aria-live="polite">
    <div id="menu-content">
      <p class="empty">Cargando el menú...</p>
    </div>
  </main>

  <footer class="shell">
    <p class="footer-details">
      <span>Paseo Marítimo 14 y 15 Malabo, Guinea Ecuatorial</span>
      <span>Tél +240 555 911 787 – 7/7 24/24</span>
      <span>contacto@restaurante-kalytero.com</span>
    </p>
  </footer>

  <script>
    const state = { categories: [], active: "Todas", query: "" };
    const content = document.querySelector("#menu-content");
    const filters = document.querySelector("#filters");
    const search = document.querySelector("#search");
    const menuTrigger = document.querySelector("#menu-trigger");
    const categoryMenu = document.querySelector("#category-menu");

    const formatPrice = (item) => `${new Intl.NumberFormat("es-ES").format(item.precio)} ${item.moneda}`;

    const localImage = (source) => {
      const filename = source.split("/").pop();
      return source.startsWith("http") ? `assets/menu/${filename}` : source;
    };

    function renderFilters() {
      filters.innerHTML = ["Todas", ...state.categories.map((category) => category.nombre)]
        .map((name) => `<button class="filter ${state.active === name ? "active" : ""}" data-category="${name}">${name}</button>`)
        .join("");
    }

    function renderCategoryMenu() {
      categoryMenu.innerHTML = state.categories
        .map((category) => `<a href="#${slugify(category.nombre)}">${category.nombre}</a>`)
        .join("");
    }

    function closeCategoryMenu() {
      categoryMenu.hidden = true;
      menuTrigger.setAttribute("aria-expanded", "false");
      menuTrigger.setAttribute("aria-label", "Abrir categorías");
    }

    menuTrigger.addEventListener("click", () => {
      const isOpen = menuTrigger.getAttribute("aria-expanded") === "true";
      menuTrigger.setAttribute("aria-expanded", String(!isOpen));
      menuTrigger.setAttribute("aria-label", isOpen ? "Abrir categorías" : "Cerrar categorías");
      categoryMenu.hidden = isOpen;
    });

    categoryMenu.addEventListener("click", closeCategoryMenu);

    function renderMenu() {
      const query = state.query.toLocaleLowerCase("es");
      const visibleCategories = state.categories
        .filter((category) => state.active === "Todas" || category.nombre === state.active)
        .map((category) => ({
          ...category,
          items: category.items.filter((item) => `${item.nombre} ${item.descripcion || ""}`.toLocaleLowerCase("es").includes(query))
        }))
        .filter((category) => category.items.length);

      if (!visibleCategories.length) {
        content.innerHTML = `<p class="empty">No hemos encontrado ningún plato con “${state.query}”.</p>`;
        return;
      }

      content.innerHTML = visibleCategories.map((category) => `
        <section class="category" id="${slugify(category.nombre)}">
          <div class="category-heading">
            <h2>${category.nombre}</h2>
            <span class="category-count">${category.items.length} ${category.items.length === 1 ? "opción" : "opciones"}</span>
          </div>
          <div class="items">
            ${category.items.map((item) => `
              <article class="item">
                <img class="item-image" src="${localImage(item.imagen)}" alt="${item.nombre}" loading="lazy" decoding="async">
                <div class="item-details">
                  <div class="item-top">
                    <h3>${item.nombre}</h3>
                    <span class="price">${formatPrice(item)}</span>
                  </div>
                  ${item.descripcion ? `<p class="description">${item.descripcion}</p>` : ""}
                </div>
              </article>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function slugify(value) {
      return value.toLocaleLowerCase("es").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-");
    }

    filters.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;
      state.active = button.dataset.category;
      renderFilters();
      renderMenu();
    });

    search.addEventListener("input", (event) => {
      state.query = event.target.value.trim();
      renderMenu();
    });

    fetch("./menu-kalytero.json")
      .then((response) => {
        if (!response.ok) throw new Error("No se pudo cargar el menú");
        return response.json();
      })
      .then((data) => {
        state.categories = data.categorias;
        renderFilters();
        renderCategoryMenu();
        renderMenu();
      })
      .catch(() => {
        content.innerHTML = `<p class="empty">No se ha podido cargar el menú. Abre esta página desde un servidor local.</p>`;
      });
  </script>
</body>
</html>
